name: Update Homebrew tap

# Publishing a release updates the version and SHA-256 of the Baplet cask in
# konkord-io/homebrew-tap, so `brew install konkord-io/tap/baplet` gets the new DMG.
# HOMEBREW_TAP_TOKEN is a fine-grained token with Contents read and write on the tap repo.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to put in the cask (e.g. v0.5.0)
        required: true

permissions:
  contents: read

jobs:
  cask:
    name: Update cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update Casks/baplet.rb
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask was not updated."
            exit 1
          fi
          version="${TAG#v}"
          digest="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q ".assets[] | select(.name == \"Baplet-$version.dmg\") | .digest")"
          sha="${digest#sha256:}"
          if [ "${#sha}" -ne 64 ]; then
            echo "::error::Release $TAG has no Baplet-$version.dmg with a sha256 digest."
            exit 1
          fi
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/konkord-io/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/baplet.rb
          if git diff --quiet; then
            echo "The cask is already at $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "baplet $version"
          git push --quiet
          echo "Updated the cask to $version ($sha)."
